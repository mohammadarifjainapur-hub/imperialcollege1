<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Imperial Science PU College | Login</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0284c7; --primary-dark: #0369a1; --secondary: #0ea5e9; --bg-color: #f1f5f9; --surface: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --danger: #ef4444; --success: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #cbd5e1; display: flex; justify-content: center; align-items: center; height: 100dvh; overflow: hidden; }
        .app-container { width: 100%; max-width: 414px; height: 100dvh; background: var(--bg-color); position: relative; display: flex; flex-direction: column; justify-content: center; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.1); }
        @media(min-width: 450px) { .app-container { height: 90vh; max-height: 850px; border-radius: 40px; border: 8px solid #ffffff; } }
        .bg-shape { position: absolute; border-radius: 50%; filter: blur(60px); z-index: 0; opacity: 0.4; }
        .shape1 { top: -10%; left: -10%; width: 300px; height: 300px; background: var(--primary); }
        .shape2 { bottom: -10%; right: -10%; width: 250px; height: 250px; background: #38bdf8; }
        .login-container { padding: 40px 30px; background: rgba(255, 255, 255, 0.85); border-radius: 30px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 50px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05); position: relative; z-index: 1; margin: 0 20px; transform: translateY(20px); opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeUp { to { transform: translateY(0); opacity: 1; } }
        .logo-box { width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: 0 15px 30px rgba(2, 132, 199, 0.3); color: white; font-size: 38px; transform: rotate(-5deg); transition: 0.3s; }
        h1 { text-align: center; font-size: 26px; color: var(--text-main); margin-bottom: 6px; font-weight: 800; letter-spacing: -0.5px; }
        p.subtitle { text-align: center; color: var(--primary); font-size: 14px; font-weight: 600; margin-bottom: 35px; text-transform: uppercase; letter-spacing: 1px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 22px; transition: 0.3s; }
        .input-field { width: 100%; padding: 18px 18px 18px 52px; background: #ffffff; border: 2px solid #e2e8f0; border-radius: 18px; font-size: 15px; color: var(--text-main); transition: all 0.3s; font-weight: 600; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .input-field::placeholder { color: #94a3b8; font-weight: 500; }
        .input-field:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15), inset 0 2px 4px rgba(0,0,0,0.02); }
        .input-field:focus + i, .input-group:focus-within i { color: var(--primary); }
        .btn-main { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 18px; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.3); margin-top: 10px; }
        .btn-main:active { transform: translateY(2px); }
        #loader { position: absolute; top:0; left:0; width:100%; height:100%; background:var(--bg-color); z-index: 9999; display: flex; flex-direction:column; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .spinner { width: 50px; height: 50px; border: 4px solid #cbd5e1; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-top:20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); padding: 16px 24px; border-radius: 100px; background: var(--text-main); color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 10000; font-weight: 600; font-size: 14px; white-space: nowrap;}
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error i { color: var(--danger); }
        .toast.success i { color: var(--success); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-shape shape1"></div>
        <div class="bg-shape shape2"></div>
        <div id="loader"><div class="logo-box" style="box-shadow:none; margin-bottom: 0;"><i class='bx bx-atom'></i></div><div class="spinner"></div><p style="margin-top:20px; color:var(--text-muted); font-weight:600;">Connecting...</p></div>
        <div class="toast" id="toastBox"><i class='bx bx-info-circle'></i> <span id="toastMsg">Message</span></div>
        
        <div class="login-container">
            <div class="logo-box"><i class='bx bx-atom'></i></div>
            <h1>Imperial Science PU</h1>
            <p class="subtitle">Unified Academic Portal</p>
            <div class="input-group">
                <input type="text" id="regNo" class="input-field" placeholder="User ID / Reg No.">
                <i class='bx bx-user'></i>
            </div>
            <div class="input-group">
                <input type="password" id="regPass" class="input-field" placeholder="Secure Password">
                <i class='bx bx-lock-alt'></i>
            </div>
            <button type="button" class="btn-main" onclick="loginUser()" id="loginBtn">Access Portal <i class='bx bx-right-arrow-alt'></i></button>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbx8tSGdpDJ0D4zAZWEA0yxjR3BWD_wlD6MRcUVfkxxUTefhXasDyWGbxSDG1Jv5tkSc/exec';
        
        window.onload = () => {
            const role = localStorage.getItem('userRole');
            if(role === 'admin') window.location.href = 'admin.html';
            else if(role === 'teacher') window.location.href = 'teacher.html';
            else if(role === 'student' || role === 'student_1' || role === 'student_2') window.location.href = 'student.html';
            else setTimeout(() => { document.getElementById('loader').style.opacity = '0'; setTimeout(()=>document.getElementById('loader').style.display='none', 500); }, 800);
        };

        function showToast(msg, type='info') {
            const toast = document.getElementById('toastBox');
            document.getElementById('toastMsg').innerText = msg;
            toast.className = `toast show ${type}`;
            toast.querySelector('i').className = type === 'error' ? 'bx bxs-error-circle' : 'bx bxs-check-circle';
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function loginUser() {
            const regNo = document.getElementById('regNo').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            if(!regNo || !pass) return showToast("Credentials required", "error");
            
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "<i class='bx bx-loader-alt bx-spin'></i> Authenticating...";
            btn.style.pointerEvents = 'none';
            
            try {
                const res = await fetch(`${API_URL}?action=login`, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ register_no: regNo, password: pass }) });
                const data = await res.json();
                
                btn.innerHTML = originalText; btn.style.pointerEvents = 'auto';
                
                if (data.status === 'error' || data.error) {
                    showToast(data.message || data.error, "error"); 
                } else {
                    showToast("Access Granted!", "success");
                    localStorage.setItem('userRegNo', data.register_no);
                    localStorage.setItem('userName', data.name);
                    localStorage.setItem('userRole', data.role);
                    
                    setTimeout(() => { 
                        let targetPage = (data.role === 'student_1' || data.role === 'student_2' || data.role === 'student') ? 'student' : data.role;
                        window.location.href = targetPage + '.html'; 
                    }, 800);
                }
            } catch (err) {
                btn.innerHTML = originalText; btn.style.pointerEvents = 'auto';
                showToast("Connection Error. Check network.", "error");
            }
        }
    </script>
</body>
</html>
